<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Bitbliothèque</title>
</head>
<body>

    <div class="ContainerBiblio">
        <div class="GestionLivres styles">
            
            <div class="AddLivres">
                <h2 class="textCenter">Gestion des livres</h2>
                <form>
                    <input type="text" id="titre" placeholder="Titre du livre" required>
                    <input type="text" id="auteur" placeholder="Auteur du livre" required>
                    <input type="number" id="quantite" placeholder="Nombre de livres" required>
                    <div class="containerButton">
                        <input type="button" id="addDatas" value="Ajouter">
                        <input type="reset" value="Annuler">
                    </div>
                </form>
            </div>
            <div class="ShowLivres viewStyles">
                <h3 class="textCenter">Liste des Livres</h3>

                <div class="LivresList ShowDatas">
                    <table border="">
                        <thead>
                            <tr>
                                <th scope="col">Titre</th>
                                <th scope="col">Auteur</th>
                                <th scope="col">Quantité</th>
                                <th scope="col">Retirer</th>
                                <th scope="col">Modifier</th>
                            </tr>
                        </thead>
                        <tbody id="tableauLivres">
                            <!-- Le contenu généré par JavaScript viendra ici. -->
                            <!-- Plus besoin de la ligne de test, on peut la supprimer. -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
        <div class="GestionUtilisateurs styles">
            
            <div class="AddUsers">
                <h2 class="textCenter">Gestion des utilisateurs</h2>
                <form>
                    <input type="text" placeholder="Entrer un nom">
                    <input type="text" placeholder="Entrer un prénom">
                    <input type="text" placeholder="Entrer un email">
                    <div class="containerButton">
                        <input type="button" value="Enregistrer">
                        <input type="reset" value="Annuler">
                    </div>
                </form>
            </div>
            <div class="ShwoUsers viewStyles">
                <h3 class="textCenter">Liste des utilisateurs</h3>
                <div class="UsersLivres ShowDatas">
                    <table border="">
                        <thead>
                            <tr>
                                <th scope="col">Nom</th>
                                <th scope="col">Prénom</th>
                                <th scope="col">Email</th>
                                <th scope="col">Retirer</th>
                                <th scope="col">Modifier</th>
                            </tr>
                        </thead>
                        <tbody id="tableauUsers">
                            <!-- Le contenu généré par JavaScript viendra ici. -->
                            <!-- Plus besoin de la ligne de test, on peut la supprimer. -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
        <div class="GestionEmprunts styles">
            
            <div class="AssocierAndStatus">
                <h2 class="textCenter">Gestion des emprunts</h2>
                <form>
                    <input type="text" placeholder="Nom de l'utilisateur">
                    <input type="text" placeholder="Nom du livre">
                    <div class="containerButton">
                        <input type="button" value="Associer">
                        <input type="reset" value="Annuler">
                    </div>
                </form>
            </div>
            <div class="ShowUmprunts viewStyles">
                <h3 class="textCenter">List des Emprunts</h3>
                <div class="UmpruntLivres ShowDatas">
                    <table border="">
                        <thead>
                            <tr>
                                <th scope="col">Nom</th>
                                <th scope="col">Titre</th>
                                <th scope="col">Statut</th>
                                <th scope="col">Retirer</th>
                                <th scope="col">Restituer</th>
                            </tr>
                        </thead>
                        <tbody id="tableauEmprunts">
                            <!-- Le contenu généré par JavaScript viendra ici. -->
                            <!-- Plus besoin de la ligne de test, on peut la supprimer. -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <div id="UpdateLivres" class="ContainerUpdate none">
        <div class="AddLivres">
            <p onclick="closeForm()">X</p>
            <form>
                <h2 class="textCenter">Modifier un livre</h2>
                <input type="text" id="updateTitre" placeholder="Titre du livre" required>
                <input type="text" id="updateAuteur" placeholder="Auteur du livre" required>
                <input type="number" id="updateQuantite" placeholder="Nombre de livres" required>
                <div class="containerButton">
                    <input type="button" id="updateDatas" value="Modifier">
                    <input type="reset" value="Annuler">
                </div>
            </form>
        </div>
    </div>
    
    <script src="./library.js"></script>
</body>
</html>
